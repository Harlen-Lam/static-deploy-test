<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudflare 部署测试</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f38020;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    h1 {
      color: #ffffff;
      font-size: clamp(32px, 8vw, 80px);
      font-weight: 800;
      text-align: center;
      letter-spacing: 2px;
      margin: 0;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <h1>欢迎使用 Cloudflare</h1>
  <p id="ts" style="color:#fff;opacity:.92;font-size:clamp(14px,3vw,20px);text-align:center;margin-top:18px;font-weight:500;"></p>
  <script>
    document.getElementById('ts').textContent = '部署检测于 ' + new Date().toLocaleString('zh-CN');
  </script>
</body>
</html>
